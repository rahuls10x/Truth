name: Truth
services:
  frontend-server:
    build:
      context: ./frontend-server
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
    ports:
      - "${FRONTEND_BIND_IP:-127.0.0.1}:${FRONTEND_PORT:-5173}:80"
    depends_on:
      - authentication-server
      - resource-server

  authentication-server:
    build: ./authentication-server
    ports:
      - "${AUTH_BIND_IP:-127.0.0.1}:${AUTH_PORT:-4000}:4000"
    environment:
      ORIGIN_URL: ${ORIGIN_URL:-http://localhost:5173}
      MONGO_DB: mongodb://mongo:27017
      REDIS_DB: redis://redis:6379
      PORT: 4000
    depends_on:
      - mongo
      - redis

  resource-server:
    build: ./resource-server
    ports:
      - "${RESOURCE_BIND_IP:-127.0.0.1}:${RESOURCE_PORT:-5000}:5000"
    environment:
      MONGO_DB: mongodb://mongo:27017
      REDIS_DB: redis://redis:6379
      PORT: 5000
    depends_on:
      - mongo
      - redis

  mongo:
    image: mongo:8
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:8
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  mongo-data:
